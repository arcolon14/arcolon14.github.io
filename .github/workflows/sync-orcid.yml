name: Sync publications from ORCID

on:
  schedule:
    - cron: "0 14 * * 1"  # Mondays, 14:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - run: python .github/scripts/sync_orcid.py

      - name: Commit changes
        run: |
          git add _publications
          if git diff --cached --quiet; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync publications from ORCID"
          git push
